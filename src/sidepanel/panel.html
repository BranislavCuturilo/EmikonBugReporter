<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <title>Bug Reporter</title>
  <link rel="stylesheet" href="../ui/ui.css">
  <style>
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header.bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-raised);
      flex: 0 0 auto;
    }

    main { flex: 1 1 auto; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }

    /* Opaque, never a gradient: screenshots scroll underneath this. */
    footer.actions {
      flex: 0 0 auto;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: var(--bg-raised);
      display: flex; gap: 8px;
    }

    /* Tiles size to their own content; a placeholder tile must not stretch the
       real screenshot next to it. */
    .shots { align-items: start; }

    .counters { display: flex; gap: 14px; font-size: 12px; }
    .counters b { font-size: 15px; display: block; font-weight: 700; }
    .counters .zero { color: var(--text-dim); }

    .empty {
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      padding: 18px 14px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
    }

    details > summary { cursor: pointer; font-size: 12px; color: var(--text-dim); padding: 4px 0; }
    details > summary::marker { color: var(--border-strong); }
  </style>
</head>
<body>
  <header class="bar">
    <span id="state" class="pill">nema sesije</span>
    <span class="spacer"></span>
    <button class="ghost sm" id="openOptions" type="button" title="Podešavanja">⚙</button>
  </header>

  <main>
    <div id="setupGap" class="note warn hidden"></div>
    <div id="detached" class="note warn hidden"></div>
    <div id="error" class="note err hidden"></div>

    <!-- counters: read over what is actually recorded, not over raw buffers -->
    <div class="counters card" id="counters">
      <div><b id="cShots" class="zero">0</b><span class="muted">slika</span></div>
      <div><b id="cErrors" class="zero">0</b><span class="muted">grešaka</span></div>
      <div><b id="cNet" class="zero">0</b><span class="muted">pali pozivi</span></div>
      <div><b id="cPages" class="zero">0</b><span class="muted">stranica</span></div>
    </div>

    <div>
      <h3>Šta se dešava</h3>
      <textarea id="note" placeholder="Piši slobodno dok prolaziš kroz aplikaciju. AI će posle pitati ono što nedostaje."></textarea>
    </div>

    <div>
      <h3>Dokazi</h3>
      <div id="shots" class="shots"></div>
      <div id="shotsEmpty" class="empty">
        Još nema nijedne slike.<br>
        Klikni <b>Slikaj</b> kad si na ekranu koji pokazuje problem.
      </div>
    </div>

    <details id="logsBox">
      <summary>Konzola i mreža</summary>
      <div class="stack" style="margin-top: 8px">
        <div>
          <h3>Konzola</h3>
          <div id="conLog" class="log card"></div>
        </div>
        <div>
          <h3>Neuspeli pozivi</h3>
          <div id="netLog" class="log card"></div>
        </div>
      </div>
    </details>

    <details id="pastBox">
      <summary>Ranije sesije</summary>
      <div id="past" class="stack" style="margin-top: 8px"></div>
    </details>
  </main>

  <footer class="actions">
    <button class="primary" id="toggle" type="button">Počni sesiju</button>
    <button id="shoot" type="button" disabled>Slikaj</button>
    <button id="record" type="button" disabled title="Snimi video — kadrovi idu na tiket kao slike">⏺ Video</button>
    <span class="spacer"></span>
    <button id="compose" type="button" disabled>Sklopi tiket →</button>
  </footer>

  <dialog class="viewer" id="viewer"><img id="viewerImg" alt=""></dialog>

  <script type="module" src="panel.js"></script>
</body>
</html>
